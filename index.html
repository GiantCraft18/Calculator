<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;transition:background .3s,color .3s,box-shadow .3s}
    :root{--bg:#1a1a2e;--bg2:#16213e;--card:#0f3460;--disp:#0a0a1a;--text:#fff;--text2:#a8b2d1;--res:#e6f1ff;--num:#1a1a3e;--numh:#2a2a5e;--op:#e94560;--oph:#ff6b81;--eq:#00d2ff;--eqh:#4de8ff;--clr:#ff6b6b;--clrh:#ff8a8a;--bk:#4a4a6a;--bkh:#5a5a8a;--shadow:rgba(0,0,0,.5);--light:rgba(255,255,255,.05);--rad:20px}
    [data-theme=light]{--bg:#f0f2f5;--bg2:#e8eaed;--card:#fff;--disp:#f8f9fa;--text:#1a1a2e;--text2:#4a4a6a;--res:#1a1a2e;--num:#e8eaed;--numh:#d5d8dd;--op:#e94560;--oph:#ff6b81;--eq:#00b4d8;--eqh:#48cae4;--clr:#ff6b6b;--clrh:#ff8a8a;--bk:#b0b8c8;--bkh:#c0c8d8;--shadow:rgba(0,0,0,.15);--light:rgba(255,255,255,.8)}
    [data-theme=green]{--bg:#0a1f0a;--bg2:#0d2b0d;--card:#1a3a1a;--disp:#0a1a0a;--text:#b8e6b8;--text2:#7aaa7a;--res:#d4f0d4;--num:#1a3a1a;--numh:#2a5a2a;--op:#4caf50;--oph:#66bb6a;--eq:#00e676;--eqh:#69f0ae;--clr:#f44336;--clrh:#ef5350;--bk:#2a4a2a;--bkh:#3a5a3a}
    body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:var(--bg);padding:1rem;position:relative;overflow:hidden}
    body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,var(--bg2)0%,transparent 60%),radial-gradient(circle at 70% 60%,var(--card)0%,transparent 50%);animation:bgShift 20s ease-in-out infinite alternate;z-index:0;opacity:.5}
    @keyframes bgShift{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(5%,5%) rotate(5deg)}}
    .calculator{background:var(--card);border-radius:calc(var(--rad)*1.5);padding:2rem 1.8rem 2.2rem;width:100%;max-width:420px;box-shadow:0 25px 50px -12px var(--shadow),inset 0 1px 2px var(--light);position:relative;z-index:1;backdrop-filter:blur(10px);border:1px solid var(--light);animation:slideUp .5s ease-out}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
    .title{color:var(--text2);font-size:.9rem;font-weight:300;letter-spacing:2px;text-transform:uppercase}
    .theme-group{display:flex;gap:8px}
    .theme-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .3s;position:relative}
    .theme-btn:hover{transform:scale(1.15)}
    .theme-btn.active{border-color:var(--text);transform:scale(1.1)}
    .theme-btn[data-theme=dark]{background:linear-gradient(135deg,#1a1a2e,#0f3460)}
    .theme-btn[data-theme=light]{background:linear-gradient(135deg,#f0f2f5,#fff);border-color:#ccc}
    .theme-btn[data-theme=green]{background:linear-gradient(135deg,#0a1f0a,#1a3a1a)}
    .display{background:var(--disp);border-radius:var(--rad);padding:1.2rem 1.8rem;margin-bottom:1.8rem;text-align:right;box-shadow:inset 0 6px 12px var(--shadow),0 1px 0 var(--light);min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;word-break:break-all;position:relative;overflow:hidden}
    .display::before{content:'';position:absolute;top:-50%;right:-50%;width:100%;height:100%;background:radial-gradient(circle,var(--light)0%,transparent 70%);opacity:.3;pointer-events:none}
    .expr{color:var(--text2);font-size:.95rem;font-weight:300;min-height:1.8rem;letter-spacing:.5px;opacity:.7;position:relative;z-index:1}
    .res{color:var(--res);font-size:3.2rem;font-weight:700;line-height:1.2;text-shadow:0 2px 8px var(--shadow);position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .2s}
    .res.error{color:var(--clr);font-size:1.8rem;white-space:normal;animation:shake .5s}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
    .res.shrink{font-size:2.2rem}
    .res.bounce{animation:bounce .2s}
    @keyframes bounce{0%{transform:scale(.8);opacity:.5}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
    .buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;z-index:1}
    .btn{background:var(--num);border:none;border-radius:var(--rad);padding:1.2rem .2rem;font-size:1.6rem;font-weight:600;color:var(--text);cursor:pointer;box-shadow:0 6px 0 var(--shadow),0 4px 12px var(--shadow);transition:all .08s;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;line-height:1;position:relative;user-select:none;min-height:60px}
    .btn:hover{background:var(--numh);transform:translateY(-2px);box-shadow:0 8px 0 var(--shadow),0 6px 20px var(--shadow)}
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
    .btn::after{content:'';position:absolute;inset:0;border-radius:var(--rad);background:radial-gradient(circle at center,rgba(255,255,255,.1)0%,transparent 70%);opacity:0;transition:opacity .3s}
    .btn:hover::after{opacity:1}
    .btn.operator{background:var(--op);color:#fff;font-size:1.8rem}
    .btn.operator:hover{background:var(--oph)}
    .btn.equals{background:var(--eq);color:var(--bg);font-size:2rem}
    .btn.equals:hover{background:var(--eqh)}
    .btn.clear{background:var(--clr);color:#fff;font-weight:700}
    .btn.clear:hover{background:var(--clrh)}
    .btn.backspace{background:var(--bk);font-size:1.4rem}
    .btn.backspace:hover{background:var(--bkh)}
    .btn.zero{grid-column:span 2}
    .status{display:flex;justify-content:space-between;margin-top:1rem;color:var(--text2);font-size:.7rem;opacity:.5;letter-spacing:.5px}
    @media(max-width:480px){.calculator{padding:1.4rem 1rem 1.6rem;border-radius:calc(var(--rad)*1.2)}.buttons{gap:10px}.btn{padding:1rem .2rem;font-size:1.4rem;min-height:52px;border-radius:calc(var(--rad)*.8)}.res{font-size:2.6rem}.res.shrink{font-size:1.8rem}.title{font-size:.7rem}.theme-btn{width:24px;height:24px}}
    @media(max-width:380px){.buttons{gap:7px}.btn{font-size:1.2rem;padding:.8rem .1rem;min-height:44px}.res{font-size:2rem}.res.shrink{font-size:1.4rem}}
  </style>
</head>
<body>

<div class="calculator">
  <div class="header">
    <span class="title">✦ Калькулятор</span>
    <div class="theme-group">
      <button class="theme-btn active" data-theme="dark"></button>
      <button class="theme-btn" data-theme="light"></button>
      <button class="theme-btn" data-theme="green"></button>
    </div>
  </div>

  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="res" id="res">0</div>
  </div>

  <div class="buttons">
    <button class="btn clear" data-v="clear">AC</button>
    <button class="btn backspace" data-v="back">⌫</button>
    <button class="btn operator" data-v="%">%</button>
    <button class="btn operator" data-v="/">÷</button>
    <button class="btn" data-v="7">7</button>
    <button class="btn" data-v="8">8</button>
    <button class="btn" data-v="9">9</button>
    <button class="btn operator" data-v="*">×</button>
    <button class="btn" data-v="4">4</button>
    <button class="btn" data-v="5">5</button>
    <button class="btn" data-v="6">6</button>
    <button class="btn operator" data-v="-">−</button>
    <button class="btn" data-v="1">1</button>
    <button class="btn" data-v="2">2</button>
    <button class="btn" data-v="3">3</button>
    <button class="btn operator" data-v="+">+</button>
    <button class="btn zero" data-v="0">0</button>
    <button class="btn" data-v=".">,</button>
    <button class="btn equals" data-v="=">=</button>
  </div>

  <div class="status">
    <span>⌨️ Клавиатура</span>
    <span id="mem">Память: пусто</span>
  </div>
</div>

<script>
  (()=>{
    'use strict';
    const E=document.getElementById('expr'),R=document.getElementById('res'),M=document.getElementById('mem');
    let s={c:'0',p:'',o:null,r:!1,j:!1,m:null};

    // Тема
    const setTheme=t=>{document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===t));localStorage.setItem('theme',t)};
    setTheme(localStorage.getItem('theme')||'dark');
    document.querySelectorAll('.theme-btn').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));

    const isDigit=v=>v>='0'&&v<='9',isOp=v=>['+','-','*','/','%'].includes(v);
    const fmt=v=>{if(v==='Error'||v==='Infinity'||v==='-Infinity'||isNaN(parseFloat(v)))return'Ошибка';let n=parseFloat(v);if(!isFinite(n))return'Ошибка';if(Number.isInteger(n))return n.toString();let str=n.toString();return str.length>16?parseFloat(n.toPrecision(12)).toString():str};
    const sym=o=>({'+':'+','-':'−','*':'×','/':'÷','%':'%'})[o]||o;
    const calc=(a,o,b)=>{let n1=parseFloat(a),n2=parseFloat(b);if(isNaN(n1)||isNaN(n2))return'Error';let r;switch(o){case'+':r=n1+n2;break;case'-':r=n1-n2;break;case'*':r=n1*n2;break;case'/':r=n2===0?'Error':n1/n2;break;case'%':r=n2===0?'Error':n1%n2;break;default:return'Error'}return r==='Error'||!isFinite(r)?'Error':(typeof r==='number'&&!Number.isInteger(r)?parseFloat(r.toPrecision(12)):r).toString()};

    const update=(b=!1)=>{let e='';if(s.p&&s.o)e=`${fmt(s.p)} ${sym(s.o)}`;if(s.c&&s.c!=='Error')e+=` ${fmt(s.c)}`;E.textContent=e.trim();let v=s.c||'0',f=fmt(v);R.textContent=f;R.classList.remove('error','shrink','bounce');if(f==='Ошибка'||s.c==='Error')R.classList.add('error');if(f.length>10&&!R.classList.contains('error'))R.classList.add('shrink');if(b&&!R.classList.contains('error')){R.classList.add('bounce');setTimeout(()=>R.classList.remove('bounce'),300)}M.textContent=s.m!==null?`Память: ${fmt(s.m)}`:'Память: пусто'};

    const clear=()=>{s={c:'0',p:'',o:null,r:!1,j:!1,m:s.m};R.classList.remove('error','shrink','bounce')};

    const handle=v=>{
      if(s.c==='Error'){if(v==='clear'){clear();update();return}clear();if(isDigit(v)||v==='.'){s.c=v==='.'?'0.':v;s.r=!1;s.j=!1;update(1);return}if(isOp(v)||v==='='||v==='back'){update();return}}

      if(isDigit(v)||v==='.'){
        if(s.j){s.c=v==='.'?'0.':v;s.p='';s.o=null;s.r=!1;s.j=!1;update(1);return}
        if(s.r){s.c=v==='.'?'0.':v;s.r=!1}else{if(v==='.'&&s.c.includes('.'))return;if(s.c.replace('-','').replace('.','').length>=15)return;s.c=v!=='.'&&s.c==='0'?v:s.c+v}
        update(1);return}

      if(isOp(v)){s.j=!1;if(s.o&&!s.r){let r=calc(s.p,s.o,s.c);if(r==='Error'){s.c='Error';s.o=null;s.p='';update();return}s.p=r;s.c=r}else{if(!s.r&&s.c)s.p=s.c;else if(!s.p)s.p=s.c||'0'}s.o=v;s.r=1;update();return}

      if(v==='='){if(s.o&&!s.r){let r=calc(s.p,s.o,s.c);if(r==='Error'){s.c='Error';s.o=null;s.p='';update();return}s.c=r;s.p='';s.o=null;s.j=1;s.r=1;update(1)}else{s.j=1;s.r=1;update()}return}

      if(v==='clear'){clear();update();return}

      if(v==='back'){if(s.j){clear();update();return}if(s.r)return;s.c=s.c.length>1?s.c.slice(0,-1):'0';update()}
    };

    document.querySelectorAll('.btn').forEach(b=>{b.onclick=()=>{let v=b.dataset.v;if(v!==undefined)handle(v)}});

    document.addEventListener('keydown',e=>{let k=e.key;if((k>='0'&&k<='9')||k==='.'){e.preventDefault();handle(k);return}if(['+','-','*','/','%'].includes(k)){e.preventDefault();handle(k);return}if(k==='Enter'||k==='='){e.preventDefault();handle('=');return}if(k==='Backspace'){e.preventDefault();handle('back');return}if(k==='Escape'||k==='Delete'){e.preventDefault();handle('clear');return}});

    clear();update();
  })();
</script>
</body>
</html>
